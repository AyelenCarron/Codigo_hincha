<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name = "keywords"content="'El Agite' red social, para: fútbol, hinchas, clubes, equipos, fanáticos, deporte, pelota, partido, gol, cancha, publicaciones, comunidad, deporte">
    <meta name = "description" content="'El Agite' es una red social donde los fanáticos del fútbol pueden compartir publicaciones, seguir a sus equipos favoritos, interactuar con otros hinchas y mantenerse informados sobre las últimas novedades deportivas. Donde el fútbol se vuelve comunidad y la pasión de cada hincha se grita en la misma cancha. Futbol pasión y tribuna. Tu deporte, tu partido, tu gol.">
    <title>Código Hincha - El Agite</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>
<body class="phone-wrapper parallax-feed">
    <header>
        <h1>El Agite</h1>
        <button id="burger" class="menu-btn" aria-label="Abrir menú">
            ☰
        </button>
        <nav id="nav-menu" class="nav-links">           
            <a href="profile.html">Mi pasión</a>
            <a href="followed.html">Hinchas</a>
            <a href="register.html">Nuevo hincha</a>
            <a href="term_conditions.html">Reglamento</a>
            <a href="index.html">Cerrar sesión</a>
        </nav>
    </header>   

    <main class="feed-main container">
        <section class="post-create">
            <div class="user-post">
                <div class="avatar">
                    <img src="img/Martín Córdoba.png" width="60" height="60" style="border-radius: 60%; object-fit: cover;">
                    
                </div>
                <input type="text" placeholder="¿Qué estás pensando?">
            </div>
        </section>

        <section class="feed">
            <article class="post-feed">
                <div class="user-feed">
                    <div class="avatar">
                        <img src="img/Martín Córdoba.png" width="50" height="50" style="border-radius: 50%; object-fit: cover;">

                    </div>
                    <div class="user-meta">
                        <h2>Martín Córdoba <span class="username">@martinT</span> <span class="team-badge">Talleres</span> <span class="time">hace 2h</span></h2>
                    </div>
                </div>

                <p class="post-text">
                    ¡La T no se mancha! Tremendo triunfo en el Kempes.
                    Esta hinchada es la más fiel de Argentina.
                    ¡Dale Talleres carajo!
                </p>

                <img src="img/pasion-albiazul.png" alt="Imágen del la cancha durante el partido" class="img-post">

                <div class="reactions">
                    <button class="reaction-btn"><i class="fas fa-thumbs-up"></i></button>
                    <button class="reaction-btn"><i class="fas fa-thumbs-down"></i></button>
                    <button class="reaction-btn"><i class="fas fa-comment"></i></button>
                </div>
                <div class="comment-box">
                    <div class="avatar">
                        <img src="img/Martín Córdoba.png" width="50" height="50" style="border-radius: 50%; object-fit: cover;">

                    </div>
                    <input type="text" placeholder="Escribe un comentario...">
                    <button class="send-btn">Enviar</button>
                </div>
            </article>
        </section>

        <section class="comments">
            <article class="comment">
            </article>
        </section>

    </main>
    <footer>
        <p>&copy; 2026 Código Hincha</p>
    </footer>
    <div class="agite-btn">   
    </div>

    <footer class="footer-ball">
        <img src="img/pelota.png" alt="Pelota de fútbol rodando" class="rolling-ball">
    </footer>

    <script>
        const burger = document.getElementById("burger");
        const navMenu = document.getElementById("nav-menu");

        burger.addEventListener("click", function() {
            navMenu.classList.toggle("active");
        });
    </script>
</body>
</html>
